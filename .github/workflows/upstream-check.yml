name: Check upstream release

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  check:
    if: github.repository_owner != 'Start9-Community'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compare stable releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          packaged="$(sed -n "s/^export const UPSTREAM_VERSION = '\([^']*\)'.*/\1/p" startos/upstream.ts)"
          latest="$(gh api repos/cashubtc/nutshell/releases/latest --jq .tag_name)"
          latest="${latest#v}"
          if [ "$packaged" = "$latest" ]; then
            exit 0
          fi

          title="Upstream Nutshell ${latest} is available"
          existing="$(gh issue list --state open --search "${title} in:title" --json title --jq ".[] | select(.title == \"${title}\") | .title")"
          if [ -n "$existing" ]; then
            exit 0
          fi

          gh issue create \
            --title "$title" \
            --body "The wrapper currently packages Nutshell ${packaged}. Review every upstream release and database migration before updating. Follow UPDATING.md; do not auto-merge this release."
