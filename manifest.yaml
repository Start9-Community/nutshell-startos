manifest-version: 2
id: nutshell
title: "Nutshell Cashu Mint"
version: 0.19.2
release-notes: "Initial release for StartOS v0.3.x"
license: MIT
wrapper-repo: "https://github.com/cashubtc/nutshell"
upstream-repo: "https://github.com/cashubtc/nutshell"
support-site: "https://github.com/cashubtc/nutshell"
marketing-site: "https://cashu.space"
description:
  short: "A Cashu Ecash Mint"
  long: "Nutshell is an implementation of a Cashu mint and wallet. Cashu is a Chaumian Ecash system for Bitcoin."
assets:
  license: LICENSE
  icon: icon.png
main:
  type: docker
  image: nutshell
  system: false
  entrypoint: "docker_entrypoint.sh"
  mounts:
    main: /data
    cln-data: /home/bitcoin/.lightning
health-checks:
  ping:
    name: Ping
    success-message: "The mint is responsive."
    type: docker
    image: nutshell
    system: false
    entrypoint: "health.sh" # Docker image puts this in /usr/local/bin
    mounts: {}
    io-format: yaml
config:
  get:
    type: script
  set:
    type: script
volumes:
  main:
    type: persistent
  cln-data:
    type: pointer
    package-id: "c-lightning"
    volume: "main"
    readonly: true
interfaces:
  main:
    name: "Cashu Mint API"
    description: "The API interface for the Cashu mint."
    lan-config:
      443:
        ssl: true
        internal: 3338
    tor-config:
      port-mapping:
        80: 3338
    ui: false
    protocols:
      - tcp
      - http
dependencies:
  c-lightning:
    version: ">=23.5.2"
    description: "Required for settling Lightning payments."
    requirement:
      type: required
